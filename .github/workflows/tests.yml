name: DR_EVT Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libboost-all-dev \
            python3 \
            python3-pip \
            libopenmpi-dev \
            openmpi-bin \
            libprotobuf-dev \
            protobuf-compiler \
            libgrpc++-dev \
            protobuf-compiler-grpc \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Display versions
        run: |
          echo "=== Compiler versions ==="
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version
          python --version
          echo "=== MPI version ==="
          if command -v mpirun >/dev/null 2>&1; then
            mpirun --version
          elif command -v srun >/dev/null 2>&1; then
            srun --version
          else
            echo "No MPI launcher (mpirun or srun) found"
          fi
          echo "=== Boost version ==="
          dpkg -l | grep libboost-dev

      - name: Create Python virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install grpcio grpcio-tools protobuf numpy scipy

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          source venv/bin/activate
          # Explicitly pin Python3_EXECUTABLE to the active venv's
          # interpreter. find_package(Python3) in SetupPybind11.cmake
          # does not reliably pick up an activated venv on its own across
          # CMake versions/environments - without this, it can silently
          # resolve to a different system Python (e.g. Ubuntu 24.04's
          # default interpreter) even with the venv active, producing an
          # ABI-tagged extension that the active venv cannot import (compiled
          # extension modules are ABI-specific to their build interpreter).
          PYTHON_EXE=$(command -v python)
          echo "Building Python bindings against: $PYTHON_EXE ($($PYTHON_EXE --version))"
          # Fresh build directory: avoids picking up a stale .so left over
          # from an earlier configure against a different Python version.
          rm -rf build install
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DDR_EVT_BUILD_PYTHON=ON \
            -DDR_EVT_ENABLE_PROTOBUF=ON \
            -DDR_EVT_ENABLE_GRPC=ON \
            -DDR_EVT_WITH_SER20=ON \
            -DDR_EVT_WITH_UNIT_TESTING=ON \
            -DPython3_EXECUTABLE=$PYTHON_EXE

      - name: Build
        run: |
          source venv/bin/activate
          cd build
          make -j$(nproc)
          # You may cap it to -j2 as defense-in-depth against
          # the gRPC/BoringSSL FetchContent OOM issue; see
          # docs/getting-started/installation.md's "Livermore Computing
          # (LC) HPC systems" section for the full explanation).
          # Build test binaries
          make test_append_job_api-bin test_checkpoint_restart-bin test_grpc_streaming_api-bin test_batch_vs_streaming-bin test_progressive_load-bin test_queue_input-bin
          # gRPC client/server + MPI multi-client/server test harness
          # (already covered by `make -j$(nproc)` above since none of
          # these are EXCLUDE_FROM_ALL, but listed explicitly here too
          # for the same clarity reason as the line above). The MPI
          # harness target only exists if find_package(MPI) succeeded at
          # configure time (see CMakeLists.txt) - `|| true` tolerates it
          # being absent rather than failing this otherwise-redundant
          # clarity line with "no rule to make target".
          make dr_evt_server-bin dr_evt_client-bin
          make test_grpc_multi_client_server-bin || true

      - name: Install
        run: |
          cd build
          make install
          echo "Installed binaries:"
          ls -lh $GITHUB_WORKSPACE/install/bin/
          echo "Installed test binaries:"
          ls -lh $GITHUB_WORKSPACE/install/bin/tests/
          echo "Installed libraries:"
          ls -lh $GITHUB_WORKSPACE/install/lib/ | head -20

      - name: Check build artifacts
        run: |
          ls -lh build/simulator
          ./build/simulator --help || true
          echo ""
          echo "Testing installed binary:"
          ls -lh install/bin/simulator
          install/bin/simulator --help || true

      - name: Run Scheduler Correctness Tests (Installed Binary)
        id: scheduler-correctness-installed
        run: |
          echo "========================================"
          echo "Running Scheduler Correctness Tests (34 fixtures) - Installed Binary"
          echo "========================================"
          ./tests/run_scheduler_correctness_tests.sh

      - name: Run Queue Implementation Differential Tests
        id: queue-impl
        run: |
          echo "========================================"
          echo "Comparing deque/multimap/block/circular queue implementations"
          echo "========================================"
          ./tests/run_fcfs_queue_implementation_tests.sh --correctness

      - name: Run Column Alias Tests
        id: column-alias
        run: |
          echo "========================================"
          echo "Testing time_limit/actual_run_time column-name aliases (8 tests)"
          echo "========================================"
          ./tests/run_column_alias_tests.sh

      - name: Run Run Time Mode Tests
        id: run-time-mode
        run: |
          echo "========================================"
          echo "Testing run_time_mode (actual/distribution/limit) and distribution capping (8 tests)"
          echo "========================================"
          ./tests/run_time_mode_tests.sh

      - name: Run Unit Tests
        id: unit
        run: |
          echo "========================================"
          echo "Running Unit Tests (7 tests)"
          echo "========================================"
          ./tests/run_unit_tests.sh

      - name: Run Feature Tests
        id: feature
        run: |
          echo "========================================"
          echo "Running Feature Tests (8 tests)"
          echo "========================================"
          ./tests/run_feature_tests.sh

      - name: Run Conservative Backfilling Tests
        id: conservative
        run: |
          echo "========================================"
          echo "Running Conservative Backfilling Tests (2 tests)"
          echo "========================================"
          echo ""
          echo "Test 1: Behavioral Correctness (EASY vs CONSERVATIVE)"
          ./tests/run_easy_vs_conservative_correctness_tests.sh
          echo ""
          echo "Test 2: Implementation Equivalence (C++ vs Python)"
          echo "Using 500 jobs on 400 nodes to exercise sustained contention"
          ./tests/compare_cpp_python_conservative.sh tests/test_traces/scale/xlarge_500jobs.csv 400

      - name: Run Replay Tests
        id: replay
        run: |
          echo "========================================"
          echo "Running Replay Tests (5 tests)"
          echo "========================================"
          ./tests/run_replay_tests.sh

      - name: Run Resource History Tests
        id: resource-history
        run: |
          echo "========================================"
          echo "Running Resource History Tests (5 tests)"
          echo "========================================"
          ./tests/run_resource_history_tests.sh

      - name: Run Job Store Tests
        id: job-store
        run: |
          echo "========================================"
          echo "Running Job Store Tests (6 tests)"
          echo "========================================"
          ./tests/run_job_store_tests.sh

      - name: Run Config Tests
        id: config
        run: |
          echo "========================================"
          echo "Running Config Tests (14 tests)"
          echo "========================================"
          ./tests/run_configs_tests.sh

      - name: Run Core CTest Tests
        id: core-ctest
        run: |
          echo "Running 19 native CTest registrations, the trace-tools test, plus MPI when available"
          cd build
          ctest --output-on-failure

      - name: Run Python API Tests
        id: python-api
        run: |
          source venv/bin/activate
          echo "========================================"
          echo "Running Python API Tests (19 tests)"
          echo "========================================"
          PYTHON_EXECUTABLE=$(command -v python) ./tests/run_python_tests.sh

      - name: Run Market Package Tests
        id: market-package
        run: |
          source venv/bin/activate
          echo "========================================"
          echo "Running Market Package Tests (12 tests)"
          echo "========================================"
          PYTHON_EXECUTABLE=$(command -v python) ./tests/run_market_tests.sh

      - name: Run gRPC Client/Server Tests
        id: grpc
        run: |
          echo "========================================"
          echo "Running gRPC Client/Server Tests (2 tests)"
          echo "========================================"
          ./tests/run_grpc_tests.sh

      - name: Run Append-Job Tests
        id: append-job
        run: |
          echo "========================================"
          echo "Running Append-Job Tests (23 C++ + 5 optional gRPC checks)"
          echo "========================================"
          ./tests/run_append_job_tests.sh

      - name: Run FCFS/EASY Backfill-Window gRPC Test
        id: backfill-window
        run: |
          echo "========================================"
          echo "Running GetBackfillWindowRequest wire test"
          echo "========================================"
          ./tests/run_backfill_window_grpc_test.sh

      - name: Run Single-Coordinator gRPC Test
        id: grpc-single-coordinator
        run: |
          source venv/bin/activate
          echo "========================================"
          echo "Running synchronized single-coordinator gRPC test"
          echo "========================================"
          python tests/test_grpc_single_coordinator.py \
            "$GITHUB_WORKSPACE/install/bin/dr_evt_server"

      - name: Run Progressive Loading Tests
        id: progressive-load
        run: |
          echo "========================================"
          echo "Running Progressive Loading Tests (11 C++ + 5 CLI)"
          echo "========================================"
          ./tests/run_progressive_load_tests.sh

      - name: Run Queue Input Schema Test
        id: queue-input-schema
        run: $GITHUB_WORKSPACE/install/bin/tests/test_queue_input

      - name: Run Scale Tests
        id: scale
        run: |
          echo "========================================"
          echo "Running Scale Tests (7 tests)"
          echo "========================================"
          ./tests/run_scale_tests.sh

      - name: Test Summary
        if: always()
        run: |
          echo "========================================"
          echo "DR_EVT Test Suite Summary"
          echo "========================================"
          echo "Compiler: ${{ matrix.compiler }}"
          echo ""
          echo "Test Results:"
          echo "  Scheduler correctness - Installed (34 fixtures): ${{ steps.scheduler-correctness-installed.outcome }}"
          echo "  Queue Impl Differential (34×4 impls): ${{ steps.queue-impl.outcome }}"
          echo "  Column Aliases (8 tests): ${{ steps.column-alias.outcome }}"
          echo "  Run Time Mode (8 tests): ${{ steps.run-time-mode.outcome }}"
          echo "  Unit (7 tests): ${{ steps.unit.outcome }}"
          echo "  Feature (8 tests): ${{ steps.feature.outcome }}"
          echo "  Conservative (2 tests): ${{ steps.conservative.outcome }}"
          echo "  Replay (5 tests): ${{ steps.replay.outcome }}"
          echo "  Resource History (5 tests): ${{ steps.resource-history.outcome }}"
          echo "  Job Store (6 tests): ${{ steps.job-store.outcome }}"
          echo "  Config (14 tests): ${{ steps.config.outcome }}"
          echo "  CTest (19 native + trace tools + MPI when available): ${{ steps.core-ctest.outcome }}"
          echo "  Python API (19 tests): ${{ steps.python-api.outcome }}"
          echo "  Market Package (12 tests): ${{ steps.market-package.outcome }}"
          echo "  Append-Job (23 C++ + 5 optional gRPC checks): ${{ steps.append-job.outcome }}"
          echo "  Backfill-window focused rerun (5 checks already counted): ${{ steps.backfill-window.outcome }}"
          echo "  Single-Coordinator gRPC: ${{ steps.grpc-single-coordinator.outcome }}"
          echo "  Progressive Loading (11 C++ + 5 CLI): ${{ steps.progressive-load.outcome }}"
          echo "  Queue Input Schema: ${{ steps.queue-input-schema.outcome }}"
          echo "  gRPC Client/Server (2 tests): ${{ steps.grpc.outcome }}"
          echo "  Scale (7 tests): ${{ steps.scale.outcome }}"
          echo ""
          echo "Outcome values: success | failure | skipped | cancelled"
          echo ""
          echo "See tests/README.md and docs/TESTING_GUIDE.md for test details."
          echo "========================================"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.compiler }}
          path: |
            /tmp/*.csv
            build/Testing/Temporary/
          retention-days: 7

  ser20-disabled:
    name: Build Without Ser20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-all-dev gcc-14 g++-14

      - name: Configure without Ser20
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build-no-ser20 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDR_EVT_WITH_SER20=OFF \
            -DDR_EVT_WITH_UNIT_TESTING=OFF \
            -DDR_EVT_ENABLE_PROTOBUF=OFF \
            -DDR_EVT_ENABLE_GRPC=OFF

      - name: Build and test native serialization
        run: |
          cmake --build build-no-ser20 \
            --target t_state_rngen-bin t_state-bin \
            -j$(nproc)
          ./build-no-ser20/t_state_rngen
          ./build-no-ser20/t_state 10 42 4 2

  redis-integration:
    name: Redis Integration (Ser20 ${{ matrix.ser20 }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ser20: ['OFF', 'ON']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libboost-all-dev \
            libgrpc++-dev \
            libhiredis-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            redis-server \
            gcc-14 \
            g++-14

      - name: Configure Redis-enabled build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build-redis \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DDR_EVT_WITH_REDIS=ON \
            -DDR_EVT_WITH_SER20=${{ matrix.ser20 }} \
            -DDR_EVT_WITH_UNIT_TESTING=OFF \
            -DDR_EVT_ENABLE_PROTOBUF=ON \
            -DDR_EVT_ENABLE_GRPC=ON

      - name: Build and install Redis-enabled binaries
        run: |
          cmake --build build-redis -j2
          cmake --install build-redis

      - name: Run Redis integration test
        env:
          CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/install
          REQUIRE_CHECKPOINT_RESTART: ${{ matrix.ser20 == 'ON' && '1' || '0' }}
        run: ./tests/run_redis_tests.sh

      - name: Run Redis gRPC client example test
        env:
          CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/install
        run: ./tests/run_redis_grpc_client_test.sh

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation with warnings as errors
        run: make -C docs html SPHINXOPTS="-W --keep-going"
